# version: '3.8'

services:
  laravel:
    image: sail-8.2/app
    container_name: laravel
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8080:80"
    networks:
      - app-network

  mariadb:
    image: mariadb:10
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: sail
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  react:
    build:
      context: ./frontend
    container_name: react
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - app-network

  # NOTE:
  # nginx is disabled temporarily
  # API development is prioritized over infrastructure
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx_sail
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - laravel
  #     - react
  #   networks:
  #     - app-network

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
